# Carries nothing but the SealedSecret holding the ACME contact address.
#
# It is a separate bundle rather than a template inside cert-manager-issuer
# because helm.valuesFrom is resolved before that chart renders. The Secret has
# to exist already, which a resource living in the same bundle cannot promise.

defaultNamespace: cert-manager

helm:
  releaseName: acme-contact

# The controller has to be running before a SealedSecret can be decrypted into a
# real Secret.
dependsOn:
  - selector:
      matchLabels:
        provides: sealed-secrets

labels:
  provides: acme-contact
