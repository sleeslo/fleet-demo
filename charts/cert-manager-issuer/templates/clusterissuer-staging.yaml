apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Both of these come from targetCustomizations in fleet.yaml, keyed on the
    # tenant label of the Cluster.
    server: {{ .Values.acme.server | quote }}
    email: {{ .Values.acme.email | quote }}

    privateKeySecretRef:
      name: letsencrypt-staging-account-key

    solvers:
      # HTTP01 over Gateway API rather than Ingress, because the Traefik chart
      # runs with the Ingress provider disabled. cert-manager creates a
      # temporary HTTPRoute attached to this Gateway to answer the challenge.
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
                kind: Gateway
