acme:
  # Fallback for a cluster that matches no targetCustomization in fleet.yaml.
  # Deliberately not a routable address: if this ever reaches a real cluster,
  # ACME registration fails visibly rather than quietly registering every tenant
  # under one shared contact.
  email: placeholder@example.internal

  # Staging endpoint. A tenant that is ready for real certificates overrides this
  # the same way it overrides the email, no separate chart needed.
  server: https://acme-staging-v02.api.letsencrypt.org/directory
